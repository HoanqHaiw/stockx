name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vattu
          POSTGRES_PASSWORD: vattu
          POSTGRES_DB: vattu_hub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vattu -d vattu_hub_test"
          --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://vattu:vattu@localhost:5432/vattu_hub_test?schema=public
      DATABASE_URL: postgresql://vattu:vattu@localhost:5432/vattu_hub_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - name: Typecheck
        run: npm run lint
      - name: Test API
        run: npm test
      - name: Build web
        run: npm run build -w apps/web
