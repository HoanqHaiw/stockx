# Gói miễn phí của Render cho server ngủ sau 15 phút không có truy cập.
# Gọi /api/health định kỳ trong giờ làm việc (giờ Việt Nam) để nhà tuyển dụng mở link là dùng được ngay.
# Cần đặt biến repo DEMO_URL (Settings → Secrets and variables → Actions → Variables), VD https://justin-stock.onrender.com
name: Keep demo awake

on:
  schedule:
    - cron: '*/10 0-15 * * 1-6' # 7h–22h59 giờ VN, thứ 2–7
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.DEMO_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.DEMO_URL }}/api/health"
